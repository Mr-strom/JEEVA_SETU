version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jeevasetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jeevasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jeevasetu_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-jeevasetu_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jeevasetu} -d ${POSTGRES_DB:-jeevasetu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jeevasetu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: jeevasetu-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://jeevasetu:jeevasetu_dev_secret@postgres:5432/jeevasetu_db?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-jeevasetu-deployment-placeholder-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      WORKER_ENABLED: "false"
      MIN_CASE_COUNT_BLACKSPOT_THRESHOLD: ${MIN_CASE_COUNT_BLACKSPOT_THRESHOLD:-5}
      DEFAULT_ACKNOWLEDGEMENT_TIMEOUT_MINUTES: ${DEFAULT_ACKNOWLEDGEMENT_TIMEOUT_MINUTES:-30}
      DEFAULT_DISPOSITION_TIMEOUT_HOURS: ${DEFAULT_DISPOSITION_TIMEOUT_HOURS:-4}
      DEFAULT_FOLLOW_UP_WINDOW_DAYS: ${DEFAULT_FOLLOW_UP_WINDOW_DAYS:-3}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: jeevasetu-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "-e", "require('./packages/api/dist/escalations/worker.js').startEscalationWorker(60000);"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://jeevasetu:jeevasetu_dev_secret@postgres:5432/jeevasetu_db?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-60000}
      MIN_CASE_COUNT_BLACKSPOT_THRESHOLD: ${MIN_CASE_COUNT_BLACKSPOT_THRESHOLD:-5}
      DEFAULT_ACKNOWLEDGEMENT_TIMEOUT_MINUTES: ${DEFAULT_ACKNOWLEDGEMENT_TIMEOUT_MINUTES:-30}
      DEFAULT_DISPOSITION_TIMEOUT_HOURS: ${DEFAULT_DISPOSITION_TIMEOUT_HOURS:-4}
      DEFAULT_FOLLOW_UP_WINDOW_DAYS: ${DEFAULT_FOLLOW_UP_WINDOW_DAYS:-3}

volumes:
  pgdata:
  redisdata:
