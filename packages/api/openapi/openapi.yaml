          $ref: '#/components/schemas/FollowUpOutcome'
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    CapacitySignal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        reasonCode:
          $ref: '#/components/schemas/CapacityReasonCode'
        signalCount:
          type: integer
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time

    BlackspotSummary:
      type: object
      properties:
        district:
          type: string
        pilotDisclaimer:
          type: string
          default: 'Pilot-period, synthetic-data only. Aggregated output suppressed below minimum case threshold.'
        minimumThresholdMet:
          type: boolean
        blackspots:
          type: array
          items:
            type: object
            properties:
              facilityId:
                type: string
                format: uuid
              facilityName:
                type: string
              topFailurePhase:
                $ref: '#/components/schemas/GapPhase'
              topCauseClass:
                $ref: '#/components/schemas/GapCauseClass'
              rejectionRate:
                type: number
              totalReferrals:
                type: integer

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - requestId
        - timestamp
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        requestId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
