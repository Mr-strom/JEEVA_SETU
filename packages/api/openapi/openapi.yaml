        facilityNameKn:
          type: string
        distanceKm:
          type: number
        specialtyMatch:
          type: boolean
        estimatedBedsAvailable:
          type: integer
        confidenceRank:
          type: integer

    Escalation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        phase:
          $ref: '#/components/schemas/GapPhase'
        likelyCause:
          $ref: '#/components/schemas/GapCauseClass'
        status:
          $ref: '#/components/schemas/EscalationStatus'
        assignedSupervisorId:
          type: string
          format: uuid
          nullable: true
        playbookSteps:
          type: array
          items:
            type: object
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    EscalationPlaybook:
      type: object
      properties:
