          type: string
          format: uuid
        gapPhase:
          $ref: '#/components/schemas/GapPhase'
        gapCauseClass:
          $ref: '#/components/schemas/GapCauseClass'
        title:
          type: string
        titleKn:
          type: string
        steps:
          type: array
          items:
            type: string
        active:
          type: boolean

    EscalationPlaybookInput:
      type: object
      properties:
        title:
          type: string
        titleKn:
          type: string
        steps:
          type: array
          items:
            type: string
        active:
          type: boolean

    FollowUpTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        assignedWorkerId:
          type: string
          format: uuid
        dueDate:
          type: string
          format: date-time
