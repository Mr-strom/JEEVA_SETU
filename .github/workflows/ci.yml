name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jeevasetu
          POSTGRES_PASSWORD: jeevasetu_test_password
          POSTGRES_DB: jeevasetu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=packages/api

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://jeevasetu:jeevasetu_test_password@localhost:5432/jeevasetu_test?schema=public
        run: npm run db:migrate:deploy --workspace=packages/api

      - name: Run Seed Verification
        env:
          DATABASE_URL: postgresql://jeevasetu:jeevasetu_test_password@localhost:5432/jeevasetu_test?schema=public
        run: npm run prisma:seed --workspace=packages/api

      - name: Workspace Lint
        run: npm run lint --workspaces

      - name: Workspace Typecheck
        run: npm run typecheck --workspaces

      - name: Run Vitest Suite (All Workspaces)
        env:
          DATABASE_URL: postgresql://jeevasetu:jeevasetu_test_password@localhost:5432/jeevasetu_test?schema=public
          JWT_SECRET: ci-testing-jwt-secret-placeholder
          NODE_ENV: test
        run: npm run test --workspaces

      - name: Production Bundle Build (All Workspaces)
        run: npm run build --workspaces
